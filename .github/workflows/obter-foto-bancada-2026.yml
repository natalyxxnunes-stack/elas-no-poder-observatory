name: Obter fotografia documental da bancada feminina (uso único)
on:
  push:
    branches:
      - redesign-editorial-v3-teste
    paths:
      - .github/workflows/obter-foto-bancada-2026.yml

permissions:
  contents: write

jobs:
  foto-documental:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: redesign-editorial-v3-teste
      - name: Baixar arquivo original da Agência Câmara e validar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/fotos
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            'https://www.camara.leg.br/midias/image/2026/03/img20260304142115193-768x473.jpg' \
            -o public/fotos/bancada-feminina-camara-marco-2026.jpg
          test "$(file -b --mime-type public/fotos/bancada-feminina-camara-marco-2026.jpg)" = image/jpeg
          test "$(stat -c %s public/fotos/bancada-feminina-camara-marco-2026.jpg)" -gt 25000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/fotos/bancada-feminina-camara-marco-2026.jpg')
          b=p.read_bytes()
          assert b[:2] == bytes([255,216]) and b[-2:] == bytes([255,217])
          print('JPEG validado:',len(b),'bytes')
          PY
          sha256sum public/fotos/bancada-feminina-camara-marco-2026.jpg
      - name: Registrar arquivo verificado na branch editorial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fotos/bancada-feminina-camara-marco-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'assets(editorial): fotografia documental da bancada feminina da Câmara, março de 2026'
            git push origin HEAD:redesign-editorial-v3-teste
          fi
