name: Limpar intermediarios de QA - execucao unica
on:
  push:
    branches: [redesign-editorial-v3-teste]
    paths: [.github/workflows/qa-limpar-auxiliares-15nov.yml]
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preservar JPEGs e relatorios, retirar apenas base64 temporarios
        shell: bash
        run: |
          set -euo pipefail
          find docs/auditorias/qa-paginas-15nov -type f -name '*.b64.txt' -print -delete
          git rm -f .github/workflows/qa-preview-encoded-temp.yml
          git rm -f .github/workflows/qa-limpar-auxiliares-15nov.yml
          git add -u docs/auditorias/qa-paginas-15nov
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 0
          git commit -m 'chore(qa): remover imagens base64 e fluxos temporarios, preservar capturas'
          git push origin HEAD:redesign-editorial-v3-teste
