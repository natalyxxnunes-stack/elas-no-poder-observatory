name: Gerar recorte partidário pós-Claude
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/auditoria/recontagem_pos_claude.py
      - .github/workflows/gerar-recortes-pos-claude.yml
permissions:
  contents: write
jobs:
  recortes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'homologacao-pos-claude-2026-11-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recontar exclusivamente com os ZIPs de 25/11
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tse"
          curl --fail --location --silent --show-error --retry 3 --max-time 900 "https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip" -o "$RUNNER_TEMP/tse/cand.zip"
          curl --fail --location --silent --show-error --retry 3 --max-time 900 "https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip" -o "$RUNNER_TEMP/tse/contas.zip"
          python scripts/auditoria/recontagem_pos_claude.py "$RUNNER_TEMP/tse/cand.zip" "$RUNNER_TEMP/tse/contas.zip" "$RUNNER_TEMP/recortes"
      - uses: actions/upload-artifact@v4
        with:
          name: recortes-financeiros-pos-claude
          path: ${{ runner.temp }}/recortes/
          retention-days: 90
      - name: Versionar somente o agregado partidário
        run: |
          set -euo pipefail
          dest="docs/auditorias/pos-claude-2026-11-25/fefc-origem-partidaria-proporcional.json"
          cp "$RUNNER_TEMP/recortes/fefc-origem-partidaria-proporcional.json" "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: versionar FEFC de origem partidária com hashes conferidos"
          git pull --rebase origin homologacao-pos-claude-2026-11-25
          git push origin HEAD:homologacao-pos-claude-2026-11-25
