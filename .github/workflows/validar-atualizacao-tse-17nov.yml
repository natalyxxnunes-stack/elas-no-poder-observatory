name: Validar atualização financeira TSE 17-11

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - docs/auditorias/financiamento-2026-17nov/**
      - .github/workflows/validar-atualizacao-tse-17nov.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Conferir agregados e invariantes do corte financeiro
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          b=pathlib.Path("docs/auditorias/financiamento-2026-17nov")
          d={name:json.loads((b/name).read_text()) for name in
             ["receitas-agregadas.json","despesas-agregadas.json","fefc-proporcional.json","fefc-titulares.json","reconciliacao.json","manifest.json"]}
          rev=d["receitas-agregadas.json"]
          assert rev["baseGeneratedAt"]=="17/11/2026 09:03:49"
          assert rev["candidaciesWithRevenue"]==19665
          assert sum(rev["tiposPrestacao"].values())==19665
          assert rev["duplicateRows"]==981
          assert d["reconciliacao.json"]["status"]=="CONFERIDO_POR_SCRIPT_ORIGINAL"
          assert len(d["reconciliacao.json"]["comparacoes"])==14
          assert all(abs(x["dif"])<=x["tolerancia"] for x in d["reconciliacao.json"]["comparacoes"].values())
          assert d["manifest.json"]["divergencias_totalizacao"]["DEPUTADO ESTADUAL"]["encontrado"]==1011
          assert d["manifest.json"]["status"]=="FINANCEIRO_POS_16_11_RESULTADO_ELEITORAL_INCOMPLETO"
          a=rev["universes"]["proporcional"];m=rev["universes"]["majoritario"]
          assert abs(a["totalRevenue"]+m["totalRevenue"]-7021570001.15)<0.02
          assert d["fefc-titulares.json"]["total"]["candidaturas"]==20065
          assert abs(d["fefc-titulares.json"]["total"]["fefc"]-5032571764.23)<0.02
          assert abs(d["fefc-proporcional.json"]["total"]["fefc"]-3989100366.28)<0.02
          for path in ("src/data/tse-finance-snapshot.ts","src/data/fefc-partidos-2026.ts",
                       "src/data/despesas-2026.ts"):
           content=pathlib.Path(path).read_text()
           assert "financiamento-2026-17nov/" in content
           assert "financiamento-2026-15nov/" not in content
          print("Controles de integridade e importações OK.")
          PY
      - name: Instalar dependências travadas
        run: bun install --frozen-lockfile
      - name: Gerar prévia técnica do site
        run: bun run build:hostgator
      - name: Conferir lint do escopo alterado sem formatar o legado
        run: |
          bunx eslint \
            src/data/tse-finance-snapshot.ts \
            src/data/fefc-partidos-2026.ts \
            src/data/despesas-2026.ts \
            src/data/competitividade.ts \
            src/data/achados.ts \
            src/data/metodo-publico.ts \
            src/data/calendario.ts \
            src/routes/dinheiro.tsx \
            src/routes/partidos.tsx \
            src/components/editorial/DespesasCharts.tsx \
            --rule 'prettier/prettier: off'
