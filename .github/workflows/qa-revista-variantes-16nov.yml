name: QA revista — seis temas, fichas individuais e prova TSE
on:
  push:
    branches: [revista-consolidada-ajustes-de-ritmo-16nov2026]
  workflow_dispatch:
concurrency:
  group: qse-variantes-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: TypeScript e compilação HostGator
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build:hostgator
      - name: Confirmar HTML proprio de todas as eleitas e temas no pacote HostGator
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          eleitas=Path("src/data/eleitas-2026.ts").read_text()
          temas=Path("src/data/temas.ts").read_text()
          slugs_eleitas=re.findall(r'"slug": "([^"]+)"',eleitas)
          slugs_temas=re.findall(r'slug: "(presenca|dinheiro|agenda|poder|violencia|memoria)"',temas)
          assert len(slugs_eleitas)==len(set(slugs_eleitas)) and len(slugs_eleitas)>=342,("fichas duplicadas ou ausentes",len(slugs_eleitas))
          assert len(slugs_temas)==6 and len(set(slugs_temas))==6,slugs_temas
          raiz=Path("dist/client")
          ausentes=[str(raiz/"eleitas"/slug/"index.html") for slug in slugs_eleitas if not (raiz/"eleitas"/slug/"index.html").exists()]
          ausentes += [str(raiz/"temas"/slug/"index.html") for slug in slugs_temas if not (raiz/"temas"/slug/"index.html").exists()]
          sitemap=(raiz/"sitemap.xml").read_text()
          ausentes += ["sitemap: "+slug for slug in slugs_eleitas if "/eleitas/"+slug+"</loc>" not in sitemap]
          print("Fichas eleitorais",len(slugs_eleitas),"Temas",len(slugs_temas),"Paginas ausentes",len(ausentes))
          assert not ausentes,ausentes[:30]
          PY
      - name: Preparar Playwright e axe-core
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          curl --fail --location --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.min.js
          test "$(wc -c </tmp/axe.min.js)" -gt 100000
      - name: Auditar seis temas, duas eleitas e captura oficial TSE em tres larguras
        run: |
          set -euo pipefail
          mkdir -p relatorios-variantes
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-variantes-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          routes=[
            ('/temas/presenca','tema-presenca'),
            ('/temas/dinheiro','tema-dinheiro'),
            ('/temas/agenda','tema-agenda'),
            ('/temas/poder','tema-poder'),
            ('/temas/violencia','tema-violencia'),
            ('/temas/memoria','tema-memoria'),
            ('/eleitas/perpetua-almeida-ac','ficha-perpetua'),
            ('/eleitas/raquel-lyra-pe','ficha-raquel'),
            ('/quem-sao-elas','candidatas')
          ]
          out=[];hard=[];violations=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,w,h in [('desktop',1440,900),('celular',390,844),('reflow_320',320,720)]:
              ctx=browser.new_context(viewport={'width':w,'height':h},device_scale_factor=1)
              for route,name in routes:
                page=ctx.new_page()
                js=[]
                page.on('pageerror',lambda e:js.append(str(e)))
                try:
                  response=page.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded',timeout=30000)
                  page.evaluate("""async() => {
                    const images=Array.from(document.images);
                    images.forEach(img=>img.loading='eager');
                    await Promise.all(images.map(img=>img.decode().catch(()=>{})));
                  }""")
                  page.add_script_tag(path='/tmp/axe.min.js')
                  axe=page.evaluate("""async() => {
                    const result=await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});
                    return result.violations.map(v=>({
                      id:v.id,impact:v.impact,description:v.description,
                      help:v.help,helpUrl:v.helpUrl,
                      nodes:v.nodes.slice(0,16).map(n=>({
                        target:n.target,summary:n.failureSummary,
                        snippet:n.html.slice(0,260)
                      })),
                      totalNodes:v.nodes.length
                    }));
                  }""")
                  if device in ['desktop','celular']:
                    page.screenshot(path='relatorios-variantes/'+name+'-'+device+'.png',full_page=True,animations='disabled')
                  # Amostra de navegação por teclado e presença de indicadores.
                  keyboard=[]
                  for i in range(12):
                    page.keyboard.press('Tab')
                    f=page.evaluate("""() => {
                      const e=document.activeElement;
                      if (!e || e===document.body)return null;
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      return {tag:e.tagName,role:e.getAttribute('role'),text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,100),
                        href:e.getAttribute('href'),outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,
                        boxShadow:s.boxShadow,rect:{x:r.x,y:r.y,width:r.width,height:r.height},overflow:e.scrollWidth>e.clientWidth};
                    }""")
                    if f: keyboard.append(f)
                  # Auditoria simples de imagens documentais e legendas.
                  docs=page.evaluate("""() => Array.from(document.querySelectorAll('img[src^="/documentos/"]')).map(img => ({
                    src:img.getAttribute('src'),alt:img.getAttribute('alt'),
                    inFigure:!!img.closest('figure'),hasCaption:!!img.closest('figure')?.querySelector('figcaption'),
                    width:img.naturalWidth,height:img.naturalHeight,renderedWidth:img.getBoundingClientRect().width
                  }))""")
                  semantica=page.evaluate("""() => ({
                    h1:Array.from(document.querySelectorAll('main h1')).map(n=>n.innerText.trim().slice(0,100)),
                    main:!!document.querySelector('main'),
                    imagens:Array.from(document.querySelectorAll('main img')).map(n=>({
                      src:n.getAttribute('src'),alt:n.getAttribute('alt'),carregada:n.complete&&n.naturalWidth>0,
                      legenda:!!n.closest('figure')?.querySelector('figcaption')
                    }))
                  })""")
                  widths=page.evaluate("""() => ({scroll:document.documentElement.scrollWidth,visible:window.innerWidth})""")
                  record={'rota':route,'dispositivo':device,'http':response.status if response else None,
                          'violacoes':axe,'foco_primeiros_12':keyboard,'documentos':docs,
                          'largura':widths,'semantica':semantica,'erros_js':js}
                  out.append(record)
                  violations.extend([{'rota':route,'dispositivo':device,'id':v['id'],'impacto':v['impact'],'ocorrencias':v['totalNodes']}
                    for v in axe])
                  if not response or response.status!=200 or js or not semantica['main'] or not semantica['h1'] or widths['scroll']>w+2:hard.append(record)
                except Exception as e:
                  hard.append({'rota':route,'dispositivo':device,'erro':str(e)})
                finally:page.close()
              ctx.close()
            browser.close()
          Path('relatorios-variantes/diagnostico.json').write_text(json.dumps({'paginas':out,'erros_execucao':hard},ensure_ascii=False,indent=2))
          Path('relatorios-variantes/resumo.json').write_text(json.dumps({'total_paginas':len(out),'violacoes':violations,'erros_execucao':hard},ensure_ascii=False,indent=2))
          print('Páginas',len(out),'regras com violações',len(violations),'erros de execução',len(hard))
          for v in violations[:35]: print(v)
          assert not hard,'Falha estrutural, JS ou largura nas páginas: ver diagnostico.json'
          assert not violations,'Axe detectou violações WCAG nas páginas: ver diagnostico.json'
          PY
      - name: Conferir variantes tematicas e fichas sem retratos sem licenca
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-variantes-http2.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          from pathlib import Path
          checks=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,w,h in [('desktop',1440,900),('celular',390,844)]:
              ctx=browser.new_context(viewport={'width':w,'height':h})
              page=ctx.new_page()
              for slug in ['presenca','dinheiro','agenda','poder','violencia','memoria']:
                page.goto('http://127.0.0.1:4173/temas/'+slug,wait_until='domcontentloaded',timeout=30000)
                assert page.locator('main h1').count()==1,slug+': título ausente'
                assert page.locator('nav[aria-label="Nesta página temática"] a[href="#quem-decide"]').count()==1,slug+': navegação interna ausente'
                assert page.locator('section#quem-decide').count()==1,slug+': atores ausentes'
                for img in page.locator('main img').all():
                  img.scroll_into_view_if_needed(timeout=6000)
                  img.evaluate('async(e)=>{e.loading="eager";await e.decode()}')
                  assert img.get_attribute('alt') and img.evaluate('(e)=>e.naturalWidth>0'),slug+': imagem ausente ou sem alt'
                if slug in ['agenda','memoria']:
                  assert page.locator('main figure img[src^="/fotos/"]').count()>=1,slug+': fotografia documental não localizada'
                checks.append({'rota':'/temas/'+slug,'dispositivo':device,'status':'ok'})
              for slug in ['perpetua-almeida-ac','raquel-lyra-pe']:
                page.goto('http://127.0.0.1:4173/eleitas/'+slug,wait_until='domcontentloaded',timeout=30000)
                assert page.locator('main h1').count()==1 and page.locator('section#registro-eleita').count()==1,slug+': ficha ausente'
                assert page.locator('main header aside[aria-label="Identificação do registro eleitoral"]').count()==1,slug+': esperado registro, não retrato sem autorização'
                checks.append({'rota':'/eleitas/'+slug,'dispositivo':device,'status':'ok'})
              page.goto('http://127.0.0.1:4173/quem-sao-elas',wait_until='domcontentloaded',timeout=30000)
              img=page.locator('img[src="/documentos/tse-candidatos-2026-portal.png"]')
              assert img.count()==1,'captura portal TSE não localizada'
              img.scroll_into_view_if_needed(timeout=6000)
              img.evaluate('async(e)=>{e.loading="eager";await e.decode()}')
              assert img.evaluate('(e)=>e.naturalWidth>0')
              cap=img.locator('xpath=ancestor::figure[1]').locator('figcaption')
              assert cap.count()==1 and 'não o CSV' in cap.first.inner_text(),'Imagem sem legenda e limitação de prova'
              checks.append({'rota':'/quem-sao-elas','dispositivo':device,'status':'ok'})
              ctx.close()
            browser.close()
          Path('relatorios-variantes/interacoes.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2))
          print('Verificações funcionais de variantes:',len(checks))
          PY
      - name: Arquivar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-variantes-capturas
          path: relatorios-variantes/
          retention-days: 14
