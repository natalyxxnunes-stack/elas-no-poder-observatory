name: QA revista — Achados, Barreiras, Histórico e âncoras
on:
  push:
    branches: [revista-consolidada-ajustes-de-ritmo-16nov2026]
  workflow_dispatch:
concurrency:
  group: qse-ritmo-editorial-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: TypeScript e compilação HostGator
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build:hostgator
      - name: Preparar Playwright e axe-core
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          curl --fail --location --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.min.js
          test "$(wc -c </tmp/axe.min.js)" -gt 100000
      - name: Auditar tres cadernos e duas ancoras em tres larguras
        run: |
          set -euo pipefail
          mkdir -p relatorios-ritmo-editorial
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-ritmo-editorial-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          routes=[
            ('/achados','achados'),
            ('/barreiras','barreiras'),
            ('/historico','historico'),
            ('/','homepage-referencia'),
            ('/metodo','metodo-referencia')
          ]
          out=[];hard=[];violations=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,w,h in [('desktop',1440,900),('celular',390,844),('reflow_320',320,720)]:
              ctx=browser.new_context(viewport={'width':w,'height':h},device_scale_factor=1)
              for route,name in routes:
                page=ctx.new_page()
                js=[]
                page.on('pageerror',lambda e:js.append(str(e)))
                try:
                  response=page.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded',timeout=30000)
                  page.evaluate("""async() => {
                    const images=Array.from(document.images);
                    images.forEach(img=>img.loading='eager');
                    await Promise.all(images.map(img=>img.decode().catch(()=>{})));
                  }""")
                  page.add_script_tag(path='/tmp/axe.min.js')
                  axe=page.evaluate("""async() => {
                    const result=await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});
                    return result.violations.map(v=>({
                      id:v.id,impact:v.impact,description:v.description,
                      help:v.help,helpUrl:v.helpUrl,
                      nodes:v.nodes.slice(0,16).map(n=>({
                        target:n.target,summary:n.failureSummary,
                        snippet:n.html.slice(0,260)
                      })),
                      totalNodes:v.nodes.length
                    }));
                  }""")
                  if device in ['desktop','celular']:
                    page.screenshot(path='relatorios-ritmo-editorial/'+name+'-'+device+'.png',full_page=True,animations='disabled')
                  # Amostra de navegação por teclado e presença de indicadores.
                  keyboard=[]
                  for i in range(12):
                    page.keyboard.press('Tab')
                    f=page.evaluate("""() => {
                      const e=document.activeElement;
                      if (!e || e===document.body)return null;
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      return {tag:e.tagName,role:e.getAttribute('role'),text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,100),
                        href:e.getAttribute('href'),outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,
                        boxShadow:s.boxShadow,rect:{x:r.x,y:r.y,width:r.width,height:r.height},overflow:e.scrollWidth>e.clientWidth};
                    }""")
                    if f: keyboard.append(f)
                  # Auditoria simples de imagens documentais e legendas.
                  docs=page.evaluate("""() => Array.from(document.querySelectorAll('img[src^="/documentos/"]')).map(img => ({
                    src:img.getAttribute('src'),alt:img.getAttribute('alt'),
                    inFigure:!!img.closest('figure'),hasCaption:!!img.closest('figure')?.querySelector('figcaption'),
                    width:img.naturalWidth,height:img.naturalHeight,renderedWidth:img.getBoundingClientRect().width
                  }))""")
                  semantica=page.evaluate("""() => ({
                    h1:Array.from(document.querySelectorAll('main h1')).map(n=>n.innerText.trim().slice(0,100)),
                    main:!!document.querySelector('main'),
                    imagens:Array.from(document.querySelectorAll('main img')).map(n=>({
                      src:n.getAttribute('src'),alt:n.getAttribute('alt'),carregada:n.complete&&n.naturalWidth>0,
                      legenda:!!n.closest('figure')?.querySelector('figcaption')
                    }))
                  })""")
                  widths=page.evaluate("""() => ({scroll:document.documentElement.scrollWidth,visible:window.innerWidth})""")
                  record={'rota':route,'dispositivo':device,'http':response.status if response else None,
                          'violacoes':axe,'foco_primeiros_12':keyboard,'documentos':docs,
                          'largura':widths,'semantica':semantica,'erros_js':js}
                  out.append(record)
                  violations.extend([{'rota':route,'dispositivo':device,'id':v['id'],'impacto':v['impact'],'ocorrencias':v['totalNodes']}
                    for v in axe])
                  if not response or response.status!=200 or js or not semantica['main'] or not semantica['h1'] or widths['scroll']>w+2:hard.append(record)
                except Exception as e:
                  hard.append({'rota':route,'dispositivo':device,'erro':str(e)})
                finally:page.close()
              ctx.close()
            browser.close()
          Path('relatorios-ritmo-editorial/diagnostico.json').write_text(json.dumps({'paginas':out,'erros_execucao':hard},ensure_ascii=False,indent=2))
          Path('relatorios-ritmo-editorial/resumo.json').write_text(json.dumps({'total_paginas':len(out),'violacoes':violations,'erros_execucao':hard},ensure_ascii=False,indent=2))
          print('Páginas',len(out),'regras com violações',len(violations),'erros de execução',len(hard))
          for v in violations[:35]: print(v)
          assert not hard,'Falha estrutural, JS ou largura nas páginas: ver diagnostico.json'
          assert not violations,'Axe detectou violações WCAG nas páginas: ver diagnostico.json'
          PY
      - name: Conferir navegação dos achados, fontes de Barreiras e estado no Histórico
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-interacoes-editoriais.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          from pathlib import Path
          out=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,width,height in [('desktop',1440,900),('celular',390,844)]:
              ctx=browser.new_context(viewport={'width':width,'height':height})
              page=ctx.new_page()
              page.goto('http://127.0.0.1:4173/achados',wait_until='domcontentloaded')
              first=page.locator('nav[aria-label="Temas dos achados"] a').first
              target=first.get_attribute('href')
              assert target and page.locator(target).count()==1
              first.click()
              assert page.evaluate('location.hash')==target
              assert page.locator('main article').count()>2
              out.append({'dispositivo':device,'teste':'achados','status':'ok'})
              page.goto('http://127.0.0.1:4173/barreiras',wait_until='domcontentloaded')
              assert page.locator('section[aria-labelledby="barreiras-documentos"] a[href^="http"]').count()==3
              assert page.locator('section#violencia-politica figure').count()>=2
              assert page.locator('section#feminicidio').count()==1
              img=page.locator('img[src="/fotos/renilce-nicodemos-pl1446-camara.jpg"]')
              assert img.count()==1 and img.first.get_attribute('alt'),'Foto documental de Barreiras sem alt'
              assert img.first.evaluate('async(e)=>{await e.decode();return e.naturalWidth>500}'),'Arquivo fotográfico de Barreiras não carrega'
              assert img.first.locator('xpath=ancestor::figure[1]').locator('figcaption').count()==1,'Legenda da foto de Barreiras ausente'
              out.append({'dispositivo':device,'teste':'barreiras','status':'ok'})
              page.goto('http://127.0.0.1:4173/historico',wait_until='domcontentloaded')
              page.locator('nav[aria-label="Navegar pelas séries históricas"] a[href="#cargo-uf"]').click()
              assert page.evaluate('location.hash')=='#cargo-uf'
              uf=page.locator('section[aria-label="Selecionar estado para comparação histórica"] select')
              assert uf.count()==1
              vals=uf.locator('option').evaluate_all('(xs)=>xs.map(x=>x.value).filter(Boolean)')
              assert len(vals)>=2
              pick=vals[1] if uf.input_value()==vals[0] else vals[0]
              uf.select_option(pick)
              assert uf.input_value()==pick
              img=page.locator('img[src="/fotos/local-votacao-2026-agencia-senado.jpg"]')
              assert img.count()==1 and img.first.get_attribute('alt'),'Foto documental de Histórico sem alt'
              assert img.first.evaluate('async(e)=>{await e.decode();return e.naturalWidth>500}'),'Arquivo fotográfico do Histórico não carrega'
              assert img.first.locator('xpath=ancestor::figure[1]').locator('figcaption').count()==1,'Legenda da foto de Histórico ausente'
              out.append({'dispositivo':device,'teste':'historico','status':'ok'})
              ctx.close()
            browser.close()
          Path('relatorios-ritmo-editorial/interacoes.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('Interações aprovadas:',len(out))
          PY
      - name: Arquivar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-ritmo-editorial-capturas
          path: relatorios-ritmo-editorial/
          retention-days: 14
