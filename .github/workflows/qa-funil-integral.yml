name: QA revista — Funil página integral
on:
  push:
    branches: [revista-funil-pagina-integral-16nov2026]
    paths:
      - 'src/routes/funil.tsx'
      - 'src/components/funnel/**'
      - 'src/components/editorial/CompetitionByUf.tsx'
      - '.github/workflows/qa-funil-integral.yml'
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: latest}
      - name: Checagem de tipos e compilação
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build:hostgator
      - name: Proteger dados e homepage
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test -z "$(git diff --name-only origin/main...HEAD -- public/dados public/fotos public/materiais src/data src/styles.css src/routes/index.tsx src/components/home/CapaEditorialV3.tsx src/components/BrandLogo.tsx src/components/BrandWordmark.tsx)"
      - name: Preparar navegador
        run: python3 -m pip install --quiet --break-system-packages playwright
      - name: Conferir experiência e tirar capturas integrais
        run: |
          set -euo pipefail
          mkdir -p qa-funil
          python3 -m http.server 4173 --directory dist/client >/tmp/site.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          sleep 3
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          dados=[]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for dev,w,h in [('desktop',1440,900),('celular',390,844)]:
              ctx=b.new_context(viewport={'width':w,'height':h},device_scale_factor=1)
              for rota,nome in [('/','home'),('/funil','funil')]:
                pg=ctx.new_page()
                errors=[]
                pg.on('pageerror',lambda e,arr=errors:arr.append(str(e)))
                resp=pg.goto('http://127.0.0.1:4173'+rota,wait_until='domcontentloaded',timeout=45000)
                pg.wait_for_timeout(500)
                assert resp and resp.status==200,(dev,rota,'HTTP')
                assert not errors,(dev,rota,'JS',errors)
                assert pg.locator('main h1').count()==1,(dev,rota,'h1')
                body_width=pg.evaluate('document.body.scrollWidth')
                assert body_width<=w+3,(dev,rota,'overflow',body_width)
                if nome=='funil':
                  main=pg.locator('main')
                  assert main.locator('aside[aria-label="Arquivos oficiais de candidaturas e vagas"]').count()==1
                  assert main.locator('a[href*="consulta_cand_2026.zip"]').count()>=1
                  assert main.locator('a[href*="consulta_vagas_2026.zip"]').count()>=1
                  assert main.locator('#etapas').count()==1 and main.locator('#disputa').count()==1
                  assert main.locator('summary').filter(has_text="Abrir todas as UFs").count()==1
                  selector=main.locator('select')
                  assert selector.count()>=1
                  if selector.first.locator('option').count()>1:
                    selector.first.select_option(index=1)
                  main.locator('summary').filter(has_text="Abrir todas as UFs").click()
                  assert main.locator('table tbody tr').count()>=27
                  pg.reload(wait_until='domcontentloaded')
                  pg.wait_for_timeout(400)
                pg.evaluate('window.scrollTo(0,0)')
                pg.screenshot(path=f'qa-funil/{dev}-{nome}-abertura.jpg',type='jpeg',quality=84)
                pg.screenshot(path=f'qa-funil/{dev}-{nome}-completa.jpg',type='jpeg',quality=70,full_page=True)
                dados.append({'device':dev,'route':rota,'width':body_width,'height':pg.evaluate('document.body.scrollHeight'),'errors':errors})
                pg.close()
              ctx.close()
            b.close()
          Path('qa-funil/resultado.json').write_text(json.dumps(dados,ensure_ascii=False,indent=2)+'\n')
          print('PASSOU',dados)
          PY
      - name: Arquivar comparativos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-funil-pagina-integral
          path: qa-funil/
          if-no-files-found: warn
          retention-days: 14
