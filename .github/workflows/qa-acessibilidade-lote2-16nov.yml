name: QA acessibilidade — segundo lote de páginas restantes
on:
  push:
    branches: [revista-acessibilidade-lote2-16nov2026]
  workflow_dispatch:
concurrency:
  group: qse-a11y-lote2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: TypeScript e compilação HostGator
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build:hostgator
      - name: Preparar Playwright e axe-core
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          curl --fail --location --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.min.js
          test "$(wc -c </tmp/axe.min.js)" -gt 100000
      - name: Auditar 7 novos modelos e duas variações em três larguras
        run: |
          set -euo pipefail
          mkdir -p relatorios-a11y-lote2
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-lote2-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          routes=[
            ('/achados','achados-indice'),
            ('/achados/quanto-mais-alto-mais-brancas','achado-individual'),
            ('/busca','busca-vazia'),
            ('/calendario','calendario'),
            ('/colecoes/antigenero-no-poder','colecao-antigenero'),
            ('/investigacoes','investigacoes'),
            ('/barreiras','barreiras'),
            ('/achados/pretas-sozinhas','achado-segunda-variacao'),
            ('/busca?q=igualdade','busca-resultado-variacao')
          ]
          out=[];hard=[];violations=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,w,h in [('desktop',1440,900),('celular',390,844),('reflow_320',320,720)]:
              ctx=browser.new_context(viewport={'width':w,'height':h},device_scale_factor=1)
              for route,name in routes:
                page=ctx.new_page()
                js=[]
                page.on('pageerror',lambda e:js.append(str(e)))
                try:
                  response=page.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded',timeout=30000)
                  page.evaluate("""async() => {
                    const images=Array.from(document.images);
                    images.forEach(img=>img.loading='eager');
                    await Promise.all(images.map(img=>img.decode().catch(()=>{})));
                  }""")
                  page.add_script_tag(path='/tmp/axe.min.js')
                  axe=page.evaluate("""async() => {
                    const result=await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});
                    return result.violations.map(v=>({
                      id:v.id,impact:v.impact,description:v.description,
                      help:v.help,helpUrl:v.helpUrl,
                      nodes:v.nodes.slice(0,16).map(n=>({
                        target:n.target,summary:n.failureSummary,
                        snippet:n.html.slice(0,260)
                      })),
                      totalNodes:v.nodes.length
                    }));
                  }""")
                  if device in ['desktop','celular']:
                    page.screenshot(path='relatorios-a11y-lote2/'+name+'-'+device+'.png',full_page=True,animations='disabled')
                  # Amostra de navegação por teclado e presença de indicadores.
                  keyboard=[]
                  for i in range(12):
                    page.keyboard.press('Tab')
                    f=page.evaluate("""() => {
                      const e=document.activeElement;
                      if (!e || e===document.body)return null;
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      return {tag:e.tagName,role:e.getAttribute('role'),text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,100),
                        href:e.getAttribute('href'),outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,
                        boxShadow:s.boxShadow,rect:{x:r.x,y:r.y,width:r.width,height:r.height},overflow:e.scrollWidth>e.clientWidth};
                    }""")
                    if f: keyboard.append(f)
                  # Auditoria simples de imagens documentais e legendas.
                  docs=page.evaluate("""() => Array.from(document.querySelectorAll('img[src^="/documentos/"]')).map(img => ({
                    src:img.getAttribute('src'),alt:img.getAttribute('alt'),
                    inFigure:!!img.closest('figure'),hasCaption:!!img.closest('figure')?.querySelector('figcaption'),
                    width:img.naturalWidth,height:img.naturalHeight,renderedWidth:img.getBoundingClientRect().width
                  }))""")
                  semantica=page.evaluate("""() => ({
                    h1:Array.from(document.querySelectorAll('main h1')).map(n=>n.innerText.trim().slice(0,100)),
                    main:!!document.querySelector('main'),
                    imagens:Array.from(document.querySelectorAll('main img')).map(n=>({
                      src:n.getAttribute('src'),alt:n.getAttribute('alt'),carregada:n.complete&&n.naturalWidth>0,
                      legenda:!!n.closest('figure')?.querySelector('figcaption')
                    }))
                  })""")
                  widths=page.evaluate("""() => ({scroll:document.documentElement.scrollWidth,visible:window.innerWidth})""")
                  record={'rota':route,'dispositivo':device,'http':response.status if response else None,
                          'violacoes':axe,'foco_primeiros_12':keyboard,'documentos':docs,
                          'largura':widths,'semantica':semantica,'erros_js':js}
                  out.append(record)
                  violations.extend([{'rota':route,'dispositivo':device,'id':v['id'],'impacto':v['impact'],'ocorrencias':v['totalNodes']}
                    for v in axe])
                  if not response or response.status!=200 or js or not semantica['main'] or not semantica['h1'] or widths['scroll']>w+2:hard.append(record)
                except Exception as e:
                  hard.append({'rota':route,'dispositivo':device,'erro':str(e)})
                finally:page.close()
              ctx.close()
            browser.close()
          Path('relatorios-a11y-lote2/diagnostico.json').write_text(json.dumps({'paginas':out,'erros_execucao':hard},ensure_ascii=False,indent=2))
          Path('relatorios-a11y-lote2/resumo.json').write_text(json.dumps({'total_paginas':len(out),'violacoes':violations,'erros_execucao':hard},ensure_ascii=False,indent=2))
          print('Páginas',len(out),'regras com violações',len(violations),'erros de execução',len(hard))
          for v in violations[:35]: print(v)
          assert not hard,'Falha estrutural, JS ou largura nas páginas: ver diagnostico.json'
          assert not violations,'Axe detectou violações WCAG nas páginas: ver diagnostico.json'
          PY
      - name: Verificar teclado, busca e abertura de caderno
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-lote2-interacoes-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          records = []
          with sync_playwright() as p:
            browser = p.chromium.launch(headless=True, executable_path='/usr/bin/google-chrome', args=['--no-sandbox','--disable-dev-shm-usage'])
            for size,w,h in [('desktop',1440,900),('celular',390,844)]:
              context = browser.new_context(viewport={'width':w,'height':h})
              page = context.new_page()
              try:
                page.goto('http://127.0.0.1:4173/busca',wait_until='networkidle')
                search = page.locator('form[role="search"] input[type="search"]')
                assert search.count()==1, 'Input da busca não encontrado'
                search.fill('igualdade')
                page.wait_for_function("new URLSearchParams(location.search).get('q') === 'igualdade'")
                status = page.locator('[aria-live="polite"]').first.inner_text()
                assert 'resultado' in status.lower(), f'Status de resultado ausente: {status}'
                assert page.locator('main a[href*="como-votaram"]').count()>0, 'Busca por igualdade não conduziu à fonte relacionada'
                search.fill('')
                page.wait_for_function("!new URLSearchParams(location.search).has('q')")
                records.append({'dispositivo':size,'controle':'busca','resultado':'aprovado','status_apos_busca':status})
                page.goto('http://127.0.0.1:4173/colecoes/antigenero-no-poder',wait_until='networkidle')
                detail = page.locator('details').first
                summary = detail.locator('summary')
                assert summary.count()==1, 'Caderno sem summary'
                assert not detail.evaluate('(e)=>e.open'), 'Caderno deveria começar fechado'
                summary.focus()
                assert summary.evaluate('(e)=>document.activeElement===e'), 'Summary não recebeu foco'
                page.keyboard.press('Enter')
                assert detail.evaluate('(e)=>e.open'), 'Enter não abriu o caderno'
                page.keyboard.press('Enter')
                assert not detail.evaluate('(e)=>e.open'), 'Enter não fechou o caderno'
                records.append({'dispositivo':size,'controle':'caderno-da-colecao','resultado':'aprovado'})
                page.goto('http://127.0.0.1:4173/achados',wait_until='networkidle')
                anchors=page.locator('nav[aria-label="Temas dos achados"] a[href^="#tema-"]')
                assert anchors.count()>0,'Não há âncoras dos achados'
                first=anchors.first.get_attribute('href').lstrip('#')
                assert page.locator('[id="'+first+'"]').count()==1,'Âncora do achado sem destino'
                records.append({'dispositivo':size,'controle':'indice-de-achados','resultado':'aprovado'})
              finally:
                page.close()
                context.close()
            browser.close()
          Path('relatorios-a11y-lote2/interacoes.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print('Interações validadas:',len(records))
          PY
      - name: Arquivar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-lote2-a11y-axe-e-capturas
          path: relatorios-a11y-lote2/
          retention-days: 14
