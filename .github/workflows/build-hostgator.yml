name: Build HostGator package

on:
  push:
    branches: [main]

jobs:
  build-hostgator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static HostGator package
        run: bun run build:hostgator

      - name: Create ZIP
        run: |
          cd dist/client
          zip -r ../../quem-sao-elas-hostgator-latest.zip .

      - name: Upload HostGator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quem-sao-elas-hostgator-latest
          path: quem-sao-elas-hostgator-latest.zip
          retention-days: 3
