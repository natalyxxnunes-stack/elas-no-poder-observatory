name: Build HostGator package

# Só roda quando acionado manualmente (aba Actions ou gh workflow run).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hostgator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static HostGator package
        run: bun run build:hostgator

      - name: Create ZIP
        run: |
          cd dist/client
          zip -r ../../quem-sao-elas-hostgator-latest.zip .

      - name: Upload HostGator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quem-sao-elas-hostgator-latest
          path: quem-sao-elas-hostgator-latest.zip
          retention-days: 7

      # Guarda o zip num branch próprio (fora do main, não sincroniza com o
      # Lovable), para quem não consegue baixar o artefato pela aba Actions.
      - name: Publish ZIP to package branch
        run: |
          BR="pacote-hostgator-${{ github.run_number }}"
          mkdir /tmp/pkg && cp quem-sao-elas-hostgator-latest.zip /tmp/pkg/
          cd /tmp/pkg
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Pacote HostGator de ${{ github.sha }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BR"
          echo "branch: $BR"
