name: Homologar tecnologia e acessibilidade pós-Claude
on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - public/**
      - bun.lock
      - .github/workflows/validar-tecnologia-pos-claude.yml
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Instalar pelo registro público sem alterar versões nem integridade
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path("bun.lock").read_text()
          assert "lovable-core-prod/sandbox-npm-cache" not in p
          PY
          bun install --frozen-lockfile --registry https://registry.npmjs.org
          git diff --exit-code -- bun.lock package.json
      - name: Testar formatação
        run: |
          bun -e '
          import {formatBRLCompact as f} from "./src/lib/format-br.ts";
          for(const [v,s] of [[1000000,"R$ 1 milhão"],[1999000,"R$ 2 milhões"],[1500000,"R$ 1,5 milhão"],[1000000000,"R$ 1 bilhão"],[2000000000,"R$ 2 bilhões"]])if(f(v)!==s)throw Error(f(v)+" != "+s);
          '
      - run: bun scripts/recontagem/validar_snapshot_financeiro.mjs
      - run: bun run build:hostgator
      - name: Conferir reprodutibilidade dos CSVs
        run: |
          bun scripts/base-publica/gerar.ts
          git diff --exit-code -- public/dados src/data/base-publica.ts
      - name: Inventariar tabelas, hierarquia e cortes no HTML
        run: |
          mkdir -p homologacao-tecnica
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          root=Path("dist/client")
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__();self.tables=[];self.active=[];self.headings=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="table":
                      self.tables.append(bool(a.get("aria-label") or a.get("aria-labelledby")));self.active.append(len(self.tables)-1)
                  elif tag=="caption" and self.active:self.tables[self.active[-1]]=True
                  elif tag in {"h1","h2","h3","h4","h5","h6"}:self.headings.append(int(tag[1]))
              def handle_endtag(self,tag):
                  if tag=="table" and self.active:self.active.pop()
          result={}
          for p in sorted(root.rglob("index.html")):
              a=Parser();s=p.read_text();a.feed(s)
              route="/"+str(p.parent.relative_to(root)).replace(".","",1) if p.parent==root else "/"+str(p.parent.relative_to(root))
              result[route]={"tables":len(a.tables),"tables_sem_nome":a.tables.count(False),"salto_inicial":a.headings[0:2]==[1,3],"cortes_rodape":"Cortes publicados:" in s and "25/11/2026" in s}
          assert len(result)>=399,len(result)
          for k in ["/dinheiro","/quem-chega","/votos","/como-votaram","/historico","/metodo"]:
              assert result[k]["cortes_rodape"],k
          assert all(not v["salto_inicial"] for k,v in result.items() if k.startswith("/achados/"))
          (Path("homologacao-tecnica")/"html.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print("HTMLS",len(result),"tabelas sem nome",sum(v["tables_sem_nome"] for v in result.values()),"rotas com saltos iniciais",sum(v["salto_inicial"] for v in result.values()))
          print("SEM_NOME",[(k,v["tables_sem_nome"]) for k,v in result.items() if v["tables_sem_nome"]])
          PY
      - name: Instalar Apache e navegador de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2
          sudo a2enmod rewrite headers expires deflate
          mkdir -p "$RUNNER_TEMP/visual"
          cd "$RUNNER_TEMP/visual"
          npm install --registry https://registry.npmjs.org --no-save playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Testar Apache, status HTTP, redirecionamentos e cache
        run: |
          set -euo pipefail
          sudo mkdir -p /var/www/qse-test
          sudo cp -a dist/client/. /var/www/qse-test/
          sudo chmod -R a+rX /var/www/qse-test
          sudo tee /etc/apache2/sites-available/qse-test.conf >/dev/null <<'APACHE'
          <VirtualHost *:80>
            ServerName localhost
            DocumentRoot /var/www/qse-test
            <Directory /var/www/qse-test>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          APACHE
          sudo a2dissite 000-default
          sudo a2ensite qse-test
          sudo apache2ctl configtest
          sudo systemctl restart apache2
          request(){ curl -sS -H 'X-Forwarded-Proto: https' -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -w '%{http_code}' "http://localhost$1"; }
          # Apache pode canonicalizar diretório sem barra com 301; testar destino e status.
          trap 'echo "Falha HTTP: linha $LINENO"; cat "$RUNNER_TEMP/headers" 2>/dev/null || true; sudo tail -n 20 /var/log/apache2/error.log || true' ERR
          status=$(request /dinheiro)
          if [ "$status" = 301 ]; then
            grep -qi 'location:.*dinheiro/' "$RUNNER_TEMP/headers"
          else
            test "$status" = 200
          fi
          test "$(request /dinheiro/)" = 200
          test "$(request /metodo/)" = 200
          test "$(request /rota-inexistente-teste-qse)" = 404
          grep -q 'Esta página não existe' "$RUNNER_TEMP/body"
          test "$(request /temas/cor-e-raca)" = 301
          grep -qi 'location:.*temas/presenca/' "$RUNNER_TEMP/headers"
          test "$(request /dados/fundo-eleitoral-deputado-por-partido.csv)" = 200
          grep -qi 'cache-control:.*max-age=3600' "$RUNNER_TEMP/headers"
          test "$(request /dinheiro/index.html)" = 200
          grep -qi 'cache-control:.*max-age=0' "$RUNNER_TEMP/headers"
          asset=$(find dist/client/assets -type f -name '*.js' -print -quit | sed 's#dist/client##')
          test -n "$asset"
          test "$(request "$asset")" = 200
          grep -qi 'cache-control:.*immutable' "$RUNNER_TEMP/headers"
          echo "OK: Apache, HTTP 200/301/404, CSV e cache."
      - name: Auditar acessibilidade e refluxo em Chromium
        run: |
          set -e
          cat > "$RUNNER_TEMP/visual/test.cjs" <<'JS'
          const {chromium}=require("playwright");
          const fs=require("fs");
          const axe=require.resolve("axe-core/axe.min.js");
          const root=process.env.GITHUB_WORKSPACE+"/homologacao-tecnica";
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const routes=["/","/dinheiro","/partidos","/barreiras","/metodo","/votos","/quem-sao-elas","/quem-chega","/como-votaram","/historico","/achados","/achados/dinheiro-brancas-peso","/eleitas/aline-gurgel-ap","/funil","/sobre","/investigacoes","/dados","/monitor","/downloads","/pioneiras/pagu"];
            const records=[];
            for(const route of routes){
              const page=await browser.newPage({viewport:{width:320,height:800},extraHTTPHeaders:{"X-Forwarded-Proto":"https"}});
              const errors=[];page.on("pageerror",e=>errors.push(e.message));
              const response=await page.goto("http://localhost"+route,{waitUntil:"domcontentloaded"});
              await page.evaluate(()=>document.fonts.ready);
              await page.addScriptTag({path:axe});
              const results=await page.evaluate(()=>axe.run({runOnly:{type:"tag",values:["wcag2a","wcag2aa","wcag21a","wcag21aa","best-practice"]}}));
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              const headings=await page.locator("main h1, main h2, main h3").evaluateAll(x=>x.map(e=>e.tagName));
              const violation=results.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}));
              const incomplete=results.incomplete.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}));
              records.push({route,status:response.status(),overflow,errors,headings,violation,incomplete});
              if(["/dinheiro","/metodo","/achados/dinheiro-brancas-peso"].includes(route))await page.screenshot({path:root+"/"+route.replaceAll("/","-").slice(1)+".png",fullPage:true});
              await page.close();
            }
            await browser.close();
            fs.writeFileSync(root+"/axe.json",JSON.stringify(records,null,2));
            for(const r of records)console.log("AUDIT",r.route,r.status,"overflow",r.overflow,"errors",r.errors.length,"violations",r.violation.map(v=>v.id+":"+v.nodes.length).join(","),"manual",r.incomplete.map(v=>v.id+":"+v.nodes.length).join(","));
            if(records.some(r=>r.status!==200||r.overflow>2||r.errors.length))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node "$RUNNER_TEMP/visual/test.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacao-tecnica-pos-claude
          path: homologacao-tecnica/
          retention-days: 90
