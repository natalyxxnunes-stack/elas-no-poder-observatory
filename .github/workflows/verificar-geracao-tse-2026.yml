name: Conferir data interna do arquivo atual do TSE (uso único)
on:
  push:
    branches: [redesign-editorial-v3-teste]
    paths:
      - .github/workflows/verificar-geracao-tse-2026.yml

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspecionar metadados e baixar arquivo público de contas de 2026
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip'
          echo '--- HEAD:'
          curl -fsSI --retry 3 --max-time 45 "$url" | grep -iE '^HTTP/|^last-modified:|^etag:|^content-length:|^date:' || true
          echo '--- DOWNLOAD:'
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 420 --silent --show-error "$url" -o /tmp/contas_tse_2026.zip
          echo '--- ARQUIVO (somente checksum e datas, sem dados pessoais):'
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import csv, zipfile, io
          p=Path("/tmp/contas_tse_2026.zip")
          filehash=sha256(p.read_bytes()).hexdigest()
          previous="65de2e2708349f619cdf6679571784e7847b500878f828fe0d6ad65351a1fc17"
          with zipfile.ZipFile(p) as z:
            options=[n for n in z.namelist() if n.lower().endswith("receitas_candidatos_2026_brasil.csv")]
            if len(options)!=1: raise RuntimeError("Arquivo de receitas nacional não encontrado: "+str(options))
            inf=z.getinfo(options[0])
            with z.open(inf) as data:
              r=csv.reader(io.TextIOWrapper(data,encoding="latin1",newline=""),delimiter=";")
              header=next(r)
              d=next(r)
              values=dict(zip(header,d))
              generation={k:values.get(k,"") for k in ("DT_GERACAO","HH_GERACAO")}
          print("zip_bytes:",p.stat().st_size)
          print("zip_sha256:",filehash)
          print("igual_ao_arquivo_de_04_11:",str(filehash==previous).lower())
          print("receitas_csv_name:",inf.filename)
          print("csv_uncompressed_bytes:",inf.file_size)
          print("csv_internal_generation:",generation)
          with open("/tmp/resumo-verificacao.txt","w") as o:
            o.write("Zip SHA-256: "+filehash+"\n")
            o.write("Igual ao zip registrado em 04/11: "+str(filehash==previous)+"\n")
            o.write("Geração do CSV: "+repr(generation)+"\n")
          PY
          cat /tmp/resumo-verificacao.txt >> "$GITHUB_STEP_SUMMARY"
