name: Recontagem auditoria financeira 2026 (13 novembro)
on:
  push:
    branches:
      - redesign-editorial-v3-teste
    paths:
      - .github/workflows/recontar-financas-tse-nov2026.yml

permissions:
  contents: read

jobs:
  recontar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Obter novas bases públicas e conferir versão
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qse-tse-2026 resultados-tse-2026
          curl -fL --retry 3 --retry-delay 3 --max-time 420 --silent --show-error             'https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip' -o /tmp/qse-tse-2026/financeiro.zip
          curl -fL --retry 3 --retry-delay 3 --max-time 300 --silent --show-error             'https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip' -o /tmp/qse-tse-2026/candidaturas.zip
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, csv, io, json
          root=pathlib.Path('/tmp/qse-tse-2026')
          specs=[
              ('financeiro.zip','receitas_candidatos_2026_BRASIL.csv','receitas.csv'),
              ('candidaturas.zip','consulta_cand_2026_BRASIL.csv','candidaturas.csv'),
          ]
          meta={}
          for zipname,source,dest in specs:
              archive=root/zipname
              with zipfile.ZipFile(archive) as z:
                  matching=[n for n in z.namelist() if n.lower().endswith(source.lower())]
                  if len(matching)!=1: raise ValueError((source,matching))
                  inf=z.getinfo(matching[0])
                  with z.open(inf) as inp, (root/dest).open('wb') as out:
                      import shutil
                      shutil.copyfileobj(inp,out)
              data=root/dest
              def sha(path):
                  h=hashlib.sha256()
                  with path.open('rb') as stream:
                      for block in iter(lambda:stream.read(1<<20), b''): h.update(block)
                  return h.hexdigest()
              with data.open('r',encoding='latin1',newline='') as f:
                  rd=csv.DictReader(f,delimiter=';')
                  first=next(rd)
              meta[dest]=dict(csvsha256=sha(data),zipsha256=sha(archive),zipbytes=archive.stat().st_size,csvbytes=data.stat().st_size,
                              geracao=str(first.get('DT_GERACAO',''))+' '+str(first.get('HH_GERACAO','')),
                              origem=zipname, csv_source=matching[0])
          (pathlib.Path('resultados-tse-2026')/'proveniencia.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          print('Datas e hashes das bases:')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - name: Reprocessar receitas com critérios publicados em 04 novembro
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/recontagem/dinheiro_2026.py             /tmp/qse-tse-2026/receitas.csv /tmp/qse-tse-2026/candidaturas.csv             > /tmp/qse-tse-2026/receitas-raw.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/qse-tse-2026/receitas-raw.json')
          x=json.loads(p.read_text())
          x.pop('candidatasMajoritarias',None)  # publicar somente agregados, sem IDs/pessoas
          Path('resultados-tse-2026/receitas-agregadas.json').write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          p.unlink()
          u=x['universes']['proporcional']
          white=u['feminineRevenueByRace']['BRANCA']['value']
          female=u['feminineRevenue']
          summary={
            'baseReceitas':x['baseGeneratedAt'],
            'linhasOriginais':x['rawRows'],
            'duplicatasRemovidas':x['duplicateRows'],
            'valorDasDuplicatas':x['duplicateValue'],
            'linhasProcessadas':x['rowsProcessed'],
            'candidaturasComReceita':x['candidaciesWithRevenue'],
            'candidaturasSemCorrespondencia':x['unmatchedCandidacies'],
            'divergenciasGeneroLinhas':x['genderMismatchRows'],
            'tiposPrestacao':x['tiposPrestacao'],
            'propCandidaturasComReceita':u['candidaciesWithRevenue'],
            'propCandidatasComReceita':u['feminineCandidaciesWithRevenue'],
            'propReceitaTotal':u['totalRevenue'],
            'propReceitaFeminina':female,
            'brancasReceita':white,
            'brancasPctReceitaMulheres':round(white/female*100,4),
            'racas':u['feminineRevenueByRace'],
            'majoritarioReceitaFeminina':x['universes']['majoritario']['feminineRevenue'],
          }
          Path('resultados-tse-2026/resumo-auditoria.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print('RESUMO RECONTAGEM DE RECEITAS')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Reprocessar fundo eleitoral por partido com ambos os universos
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/recontagem/fefc_partidos_2026.py             /tmp/qse-tse-2026/receitas.csv /tmp/qse-tse-2026/candidaturas.csv proporcional             > resultados-tse-2026/fefc-proporcional.json
          python3 -I scripts/recontagem/fefc_partidos_2026.py             /tmp/qse-tse-2026/receitas.csv /tmp/qse-tse-2026/candidaturas.csv titulares             > resultados-tse-2026/fefc-titulares.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('resultados-tse-2026/fefc-proporcional.json').read_text())['total']
          b=json.loads(Path('resultados-tse-2026/fefc-titulares.json').read_text())['total']
          print('FEFC proporcional: total',a['fefc'],'mulheres',a['mulheres']['fefc'],'candidaturas',a['candidaturas'])
          print('FEFC titulares: total',b['fefc'],'mulheres',b['mulheres']['fefc'],'candidaturas',b['candidaturas'])
          PY
      - name: Publicar resultados agregados e metadados sem dados pessoais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-recontagem-financas-13nov
          path: resultados-tse-2026/
          if-no-files-found: warn
          retention-days: 14
