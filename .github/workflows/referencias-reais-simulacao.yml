name: Materiais de referência reais — simulação editorial
on:
  push:
    branches: [pilotos-revista-visual-15nov2026]
    paths: [.github/workflows/referencias-reais-simulacao.yml]
permissions:
  contents: read
jobs:
  referencias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Copiar fotografias existentes do acervo, sem modificar ou gerar imagens
        run: |
          mkdir -p referencias
          cp public/fotos/bancada-feminina-camara-marco-2026.jpg referencias/
          cp public/fotos/bertha-lutz-1927.jpg referencias/
          cp public/fotos/plenario-igualdade-salarial-2023.jpg referencias/
          cp src/data/fotos.ts referencias/fotos-metadados.ts
      - name: Capturar documentação original TSE do portal oficial
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import pathlib
          pth=pathlib.Path('referencias/origem-tse.txt')
          url='https://dadosabertos.tse.jus.br/dataset/candidatos-2026'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            page=browser.new_page(viewport={'width':1100,'height':850},device_scale_factor=1)
            try:
              response=page.goto(url,wait_until='domcontentloaded',timeout=30000)
              status=response.status if response else None
              title=page.title()
              body=page.locator('body').inner_text()
              assert status==200 and 'Candidatos - 2026' in body and 'Creative Commons' in body,(status,title)
              page.screenshot(path='referencias/pagina-oficial-tse-2026.png',full_page=False)
              pth.write_text(f'Fonte: {url}\nHTTP: {status}\nTitulo: {title}\nCaptura original da página HTML do TSE, não fac-símile de um CSV.\n')
            except Exception as e: pth.write_text('Captura do portal não concluída: '+str(e)+'\nFonte: '+url)
            finally:browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: materiais-documentais-para-previa
          path: referencias/
          retention-days: 3
