name: QA — consolidação editorial e acervo documental (prévia)
on:
  push:
    branches: [revista-consolidacao-previews-acervo-16nov2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisao-integrada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependências, TypeScript e build HostGator
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build:hostgator
      - name: Conferir acervo, preservação editorial e contraste corrigido
        run: |
          set -euo pipefail
          git fetch --depth=1 origin revista-dados-integral-16nov2026
          test -z "$(git diff --name-only origin/revista-dados-integral-16nov2026...HEAD -- src/routes/index.tsx src/styles.css src/components/BrandLogo.tsx src/components/BrandWordmark.tsx src/data/election-2026.ts src/data/tse-finance-snapshot.ts src/data/resultado-2026.ts public/dados public/materiais)"
          test -s public/documentos/tse-candidatos-2026-portal.png
          test -s public/documentos/tse-candidatos-2026-portal-fonte.txt
          test -s public/fotos/posse-bertha-lutz-camara-1936.jpg
          grep -Fq 'color: "white"' src/components/editorial/MetodoRevista.tsx
          echo "Proteções de marca, home e dados conferidas. Acervo recuperado."
      - name: Preparar Playwright
        run: python3 -m pip install --quiet --break-system-packages playwright
      - name: Renderizar integralmente 13 páginas e homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capturas-23
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-integracao-23.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          sleep 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          paths = [
            ('/', 'home'),
            ('/eleitas/', 'quem-entrou'),
            ('/metodo', 'metodo'),
            ('/reportagens', 'reportagens'),
            ('/achados/', 'achados'),
            ('/investigacoes', 'investigacoes'),
            ('/temas/', 'temas'),
            ('/direitos', 'direitos'),
            ('/downloads', 'biblioteca'),
            ('/pioneiras/', 'pioneiras'),
            ('/sobre', 'sobre'),
            ('/barreiras', 'barreiras'),
            ('/na-voz-delas', 'na-voz-delas'),
            ('/quem-controla', 'quem-controla'),
          ]
          report = []
          failures = []
          with sync_playwright() as p:
            browser = p.chromium.launch(headless=True, executable_path='/usr/bin/google-chrome', args=['--no-sandbox', '--disable-dev-shm-usage'])
            for device, w, h in [('desktop', 1440, 900), ('celular', 390, 844)]:
              ctx = browser.new_context(viewport={'width': w, 'height': h}, device_scale_factor=1)
              for route, name in paths:
                page = ctx.new_page()
                errors = []
                page.on('pageerror', lambda error: errors.append(str(error)))
                try:
                  response = page.goto('http://127.0.0.1:4173' + route, wait_until='domcontentloaded', timeout=25000)
                  # Imagens abaixo da primeira dobra usam loading="lazy".
                  # Forçar carregamento para distinguir falha real de foto ainda não requisitada.
                  page.evaluate("""async () => {
                    const images = Array.from(document.images);
                    images.forEach(img => { img.loading = 'eager'; });
                    await Promise.all(images.map(img => img.decode().catch(() => {})));
                  }""")
                  page.wait_for_timeout(250)
                  metrics = page.evaluate("""() => ({
                    width: document.documentElement.scrollWidth,
                    viewport: innerWidth,
                    title: document.title,
                    main: Boolean(document.querySelector('main')),
                    images: Array.from(document.images).map(img => ({
                      src: img.getAttribute('src'), loaded: img.complete && img.naturalWidth > 0
                    }))
                  })""")
                  shot = 'capturas-23/' + name + '-' + device + '.png'
                  page.screenshot(path=shot, full_page=True, animations='disabled')
                  failedImgs = [im['src'] for im in metrics['images'] if not im['loaded']]
                  status = response.status if response else None
                  record = {'pagina': route, 'dispositivo': device, 'http': status, 'largura': metrics['width'], 'viewport': w,
                            'main': metrics['main'], 'imagens_falhas': failedImgs, 'erros_js': errors, 'captura': shot}
                  report.append(record)
                  if status != 200 or not metrics['main'] or errors or failedImgs or metrics['width'] > w + 2:
                    failures.append(record)
                except Exception as e:
                  failures.append({'pagina': route, 'dispositivo': device, 'erro': str(e)})
                finally:
                  page.close()
              ctx.close()
            browser.close()
          Path('capturas-23/resultados.json').write_text(json.dumps({'registros': report, 'falhas': failures}, indent=2, ensure_ascii=False))
          print('Rotas e dispositivos testados:', len(report))
          print('Problemas:', json.dumps(failures[:5], ensure_ascii=False))
          assert not failures, 'Erros de renderização, acessibilidade estrutural, imagem ou largura: ver resultados.json'
          PY
      - name: Arquivar capturas completas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-pr23-consolidacao-13-paginas
          path: |
            capturas-23/
            Quem_sao_elas_Manual_Identidade_Editorial_Continuidade_2026-11-15.md
            docs/manual-visual.md
          retention-days: 14
