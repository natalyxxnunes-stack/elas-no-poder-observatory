name: Verificação técnica da capa editorial v3
on:
  push:
    branches:
      - redesign-editorial-v3-teste

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências travadas
        run: bun install --frozen-lockfile
      - name: Validar TypeScript
        run: bunx tsc --noEmit
      - name: Build estático HostGator
        run: bun run build:hostgator
      - name: Verificar arquivos visuais no pacote construído
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            fotos/bertha-lutz-1927.jpg \
            materiais/cartilha-cota-miniatura.png \
            materiais/oficina-funil-miniatura.png \
            materiais/infografico-universos-quadrado.png; do
            test -s "dist/client/$file"
            echo "OK: $file"
          done
      - name: Capturar homepage em desktop e celular
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          mkdir -p capturas-v3
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-local.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 3
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          chrome="$(command -v google-chrome || command -v chromium)"
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --hide-scrollbars --virtual-time-budget=5000 \
            --window-size=1440,1000 --screenshot="$PWD/capturas-v3/home-desktop.png" \
            http://127.0.0.1:4173/
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --hide-scrollbars --virtual-time-budget=5000 \
            --window-size=390,844 --screenshot="$PWD/capturas-v3/home-celular.png" \
            http://127.0.0.1:4173/
          test -s capturas-v3/home-desktop.png
          test -s capturas-v3/home-celular.png
      - name: Disponibilizar capturas para avaliação editorial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-redesign-v3-capturas
          path: capturas-v3/
          if-no-files-found: warn
          retention-days: 7
