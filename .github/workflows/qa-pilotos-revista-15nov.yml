name: QA — três pilotos de revista (sem publicação)
on:
  push:
    branches:
      - pilotos-revista-visual-15nov2026
    paths:
      - "src/**"
      - "public/documentos/**"
      - ".github/workflows/qa-pilotos-revista-15nov.yml"
permissions:
  contents: read
jobs:
  conferir-pilotos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Dependências, TypeScript, base financeira e build estático
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          node scripts/recontagem/validar_snapshot_financeiro.mjs
          bunx tsc --noEmit
          bun run build:hostgator
      - name: Proteger homepage, identidade e bases
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test -z "$(git diff --name-only origin/main...HEAD -- src/data public/dados public/fotos src/styles.css src/components/BrandLogo.tsx src/components/BrandWordmark.tsx src/components/home/CapaEditorialV3.tsx src/routes/index.tsx src/components/editorial/Faixa.tsx)"
          test -s public/documentos/tse-candidatos-2026-portal.png
          test -s public/documentos/tse-candidatos-2026-portal-fonte.txt
          echo "Capa e bases preservadas; documento TSE e sua procedência presentes na prévia."
      - name: Instalar navegador de validação
        run: python3 -m pip install --quiet --break-system-packages playwright
      - name: Testar três páginas e fotografar versões completas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-pilotos
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-pilotos.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          result=[]
          routes=['/','/eleitas/','/metodo/','/reportagens/']
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,width,height in [('desktop',1440,900),('celular',390,844)]:
              context=browser.new_context(viewport={'width':width,'height':height},device_scale_factor=1)
              for route in routes:
                page=context.new_page()
                errors=[]
                page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                response=page.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded',timeout=45000)
                page.wait_for_timeout(500)
                info=page.evaluate('''() => ({
                  headings: [...document.querySelectorAll('h1')].map(x=>x.innerText.trim()),
                  sw: document.documentElement.scrollWidth,
                  width: innerWidth,
                  height: document.documentElement.scrollHeight,
                  body: document.body.innerText.slice(0,40000)
                })''')
                assert response and response.status==200,(route,device,'HTTP')
                assert not errors,(route,device,'Javascript',errors)
                assert info['sw']<=info['width']+3,(route,device,'horizontal overflow',info['sw'],info['width'])
                assert len(info['headings'])==1,(route,device,'H1',info['headings'])
                if route=='/metodo/' and device=='celular':
                  rightmost=page.evaluate('''() => [...document.querySelectorAll('main *')].map(e=>({
                    right: Math.round(e.getBoundingClientRect().right),
                    left: Math.round(e.getBoundingClientRect().left),
                    width: Math.round(e.getBoundingClientRect().width),
                    tag: e.tagName.toLowerCase(),
                    name: String(e.className).slice(0,130)
                  })).filter(e=>e.right>innerWidth+4 || e.left < -4).sort((a,b)=>b.right-a.right).slice(0,10)''')
                  more=page.evaluate('''() => ({
                    widths: [...document.querySelectorAll('html,body,main,section,aside,table,nav')].map(e=>({
                      t:e.tagName.toLowerCase(),c:String(e.className).slice(0,100),
                      cw:e.clientWidth,sw:e.scrollWidth,
                      r:Math.round(e.getBoundingClientRect().right),
                      o:getComputedStyle(e).overflowX
                    })).filter(x=>x.sw>x.cw+10).slice(0,30),
                    problematicSections:[...document.querySelectorAll('main section')].filter(e=>e.scrollWidth>e.clientWidth+10).map(e=>({
                      id:e.id,heading:e.querySelector('h2')?.innerText.slice(0,80),
                      cw:e.clientWidth,sw:e.scrollWidth,
                      children:[...e.querySelectorAll('*')].map(x=>({
                        tag:x.tagName.toLowerCase(),cls:String(x.className).slice(0,100),
                        right:Math.round(x.getBoundingClientRect().right),
                        client:x.clientWidth,scroll:x.scrollWidth,
                        text:(x.innerText||'').slice(0,45)
                      })).filter(x=>x.right>485 || x.scroll>x.client+50).sort((a,b)=>b.scroll-b.client-(a.scroll-a.client)).slice(0,9)
                    })),
                    nonClipped:[...document.querySelectorAll('main *')].filter(e=>{
                      const rect=e.getBoundingClientRect();
                      if(rect.right<=innerWidth+3 || rect.width<=0)return false;
                      for(let p=e.parentElement;p;p=p.parentElement){
                        if(['auto','scroll','hidden','clip'].includes(getComputedStyle(p).overflowX))return false;
                      }
                      return true;
                    }).map(e=>({t:e.tagName,c:String(e.className).slice(0,100),r:Math.round(e.getBoundingClientRect().right)})).slice(0,15)
                  })''')
                  print('DIAGNOSTICO LARGURA METODO CELULAR:',json.dumps({'bodyWidth':page.evaluate('document.body.scrollWidth'),'windowWidth':width,'elements':rightmost,'root':more},ensure_ascii=False))
                  assert page.evaluate('document.body.scrollWidth')<=width+3,(route,device,'largura total real',page.evaluate('document.body.scrollWidth'),width)

                if route=='/eleitas/':
                  assert '342' in info['body'],(route,device,'total')
                  assert '109 / 513' in info['body'],(route,device,'federal')
                  assert '12 / 54' in info['body'],(route,device,'senado')
                  assert 'Nomes e fichas' in info['body'],(route,device,'catalogo')
                  itens=page.locator('section[aria-labelledby="lista-eleitas"] li')
                  assert itens.count()==36,(route,device,'36 initial cards',itens.count())
                  page.get_by_role('button',name='Mostrar mais fichas').click()
                  assert itens.count()==72,(route,device,'load more')
                if route=='/metodo/':
                  assert 'Um número, uma conta verificável.' in info['body'],(route,device,'hero')
                  assert '56,1%' in info['body'],(route,device,'finance')
                  assert '15/11/2026' in info['body'],(route,device,'finance date')
                  assert 'O arquivo CSV não está reproduzido na imagem.' in info['body'],(route,device,'source distinction')
                  assert 'Como sabemos?' in info['headings'][0],(route,device,'editorial headline')
                  assert page.locator('img[src="/documentos/tse-candidatos-2026-portal.png"]').count()==1,(route,device,'real TSE capture')
                  assert page.locator('img[src="/fotos/bancada-feminina-camara-marco-2026.jpg"]').count()==1,(route,device,'real documentary photo')
                  assert page.locator('img[src="/documentos/tse-candidatos-2026-portal.png"]').evaluate('(img) => img.complete && img.naturalWidth > 200'),(route,device,'original TSE capture load')
                  foto=page.locator('img[src="/fotos/bancada-feminina-camara-marco-2026.jpg"]')
                  foto.scroll_into_view_if_needed()
                  foto.evaluate('(img) => img.decode()')
                  assert foto.evaluate('(img) => img.complete && img.naturalWidth > 200'),(route,device,'photo load')
                  assert page.locator('section[aria-labelledby="metodo-fluxo-titulo"] ol > li').count()==4,(route,device,'authored methodological infographic')
                  assert page.locator('section[aria-label="Documentação técnica do observatório"] section[id]').count()>=15,(route,device,'method archive preserved')
                  assert page.locator('a[href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026"]').count()>=1,(route,device,'primary source link')
                  assert 'Histórico de correções' in info['body'],(route,device,'correction history')
                if route=='/reportagens/':
                  assert 'Bruno Spada' in info['body'],(route,device,'photo attribution')
                  assert 'não registra as seis votações' in info['body'],(route,device,'photo context')
                  assert 'Diário da Câmara' in info['body'],(route,device,'original documents')
                  assert page.locator('a[href*="dc_20b.asp"]').count()>=1,(route,device,'direct sources')
                key=route.strip('/').replace('/','-') or 'home'
                page.evaluate('window.scrollTo(0,0)')
                page.screenshot(path=f'qa-pilotos/{device}-{key}-primeira-dobra.jpg',type='jpeg',quality=80)
                page.screenshot(path=f'qa-pilotos/{device}-{key}-pagina-inteira.jpg',type='jpeg',quality=68,full_page=True)
                if route=='/metodo/':
                  arquivo=page.locator('details#metodo-arquivo-tecnico')
                  assert arquivo.count()==1,(route,device,'caderno existente')
                  assert arquivo.get_attribute('open') is None,(route,device,'caderno fechado na entrada')
                  page.evaluate("window.location.hash = 'correcoes'")
                  page.wait_for_function("document.getElementById('metodo-arquivo-tecnico')?.open === true")
                  assert page.locator('#correcoes').is_visible(),(route,device,'correcoes com acesso por ancora')
                  assert page.locator('#dicionario').count()==1,(route,device,'dicionario preservado')
                result.append({'device':device,'page':route,'title':info['headings'][0],'height':info['height'],'javascript_errors':len(errors),'horizontal_overflow':info['sw']-info['width']})
                page.close()
              context.close()
            browser.close()
          Path('qa-pilotos/resultado.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('PASSOU:',len(result),'páginas/dispositivos com imagens da primeira dobra e da página inteira.')
          PY
      - name: Guardar evidências para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-tres-pilotos-editoriais
          path: qa-pilotos/
          if-no-files-found: warn
          retention-days: 14
