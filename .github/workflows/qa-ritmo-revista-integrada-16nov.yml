name: QA revista — fotos documentais e perfis históricos em prévia
on:
  push:
    branches: [revista-consolidada-ajustes-de-ritmo-16nov2026]
  workflow_dispatch:
concurrency:
  group: qse-revista-integrada-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: TypeScript e compilação HostGator sem foto pendente
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build:hostgator
          test ! -e dist/client/fotos/pagu-patricia-galvao-anos-1920.jpg
          test ! -e dist/client/fotos/lelia-gonzalez-cezar-loureiro-referencia.jpg
      - name: Preparar Playwright e axe-core
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          curl --fail --location --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js -o /tmp/axe.min.js
          test "$(wc -c </tmp/axe.min.js)" -gt 100000
      - name: Confirmar bloqueio da foto pendente no build normal
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-foto-producao.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            page=browser.new_page(viewport={'width':1440,'height':900})
            for slug,arquivo in [('pagu','pagu-colagem-tipografica.svg'),('lelia-gonzalez','lelia-colagem-tipografica.svg')]:
              page.goto('http://127.0.0.1:4173/pioneiras/'+slug,wait_until='domcontentloaded')
              assert page.locator('main header img[src*="/fotos/pagu-patricia-galvao"],main header img[src*="/fotos/lelia-gonzalez-cezar-loureiro"]').count()==0,slug+': retrato sob restrição no build normal'
              arte=page.locator('main header figure img[src="/arte-editorial/'+arquivo+'"]')
              assert arte.count()==1,slug+': colagem editorial ausente'
              assert arte.first.evaluate('(e)=>e.complete && e.naturalWidth>0'),slug+': colagem não carregou'
              assert arte.first.get_attribute('alt'),slug+': texto alternativo ausente'
              legenda=arte.first.locator('xpath=ancestor::figure[1]').locator('figcaption')
              assert legenda.count()==1 and 'não é retrato' in legenda.inner_text(),slug+': natureza ilustrativa sem legenda'
              assert page.locator('main header figure').count()>=2,slug+': ficha tipográfica de votação ausente'
            print('Build normal: retratos restritos bloqueados, colagens identificadas e fichas preservadas')
            browser.close()
          PY
      - name: Compilar retratos de Pagu e Lelia somente na previa editorial
        env:
          VITE_QSE_PREVIEW_PAGU_FOTO: "true"
          VITE_QSE_PREVIEW_LELIA_FOTO: "true"
        run: |
          cp docs/acervo-em-revisao/lelia-gonzalez-cezar-loureiro-referencia.jpg public/fotos/lelia-gonzalez-cezar-loureiro-referencia.jpg
          bun run build:hostgator
          test -s dist/client/fotos/pagu-patricia-galvao-anos-1920.jpg
          test -s dist/client/fotos/lelia-gonzalez-cezar-loureiro-referencia.jpg
      - name: Auditar sete paginas revistas e duas ancoras em tres larguras
        run: |
          set -euo pipefail
          mkdir -p relatorios-revista-integrada
          python3 -m http.server 4173 --directory dist/client >/tmp/qse-revista-integrada-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 3
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          routes=[
            ('/pioneiras/lelia-gonzalez','lelia'),
            ('/pioneiras/pagu','pagu-previa-foto'),
            ('/direitos','direitos'),
            ('/quem-chega','quem-chega'),
            ('/votos','votos'),
            ('/downloads','materiais'),
            ('/sobre','sobre'),
            ('/','homepage-ancora'),
            ('/metodo','metodo-ancora')
          ]
          out=[];hard=[];violations=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for device,w,h in [('desktop',1440,900),('celular',390,844),('reflow_320',320,720)]:
              ctx=browser.new_context(viewport={'width':w,'height':h},device_scale_factor=1)
              for route,name in routes:
                page=ctx.new_page()
                js=[]
                page.on('pageerror',lambda e:js.append(str(e)))
                try:
                  response=page.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded',timeout=30000)
                  page.evaluate("""async() => {
                    const images=Array.from(document.images);
                    images.forEach(img=>img.loading='eager');
                    await Promise.all(images.map(img=>img.decode().catch(()=>{})));
                  }""")
                  page.add_script_tag(path='/tmp/axe.min.js')
                  axe=page.evaluate("""async() => {
                    const result=await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});
                    return result.violations.map(v=>({
                      id:v.id,impact:v.impact,description:v.description,
                      help:v.help,helpUrl:v.helpUrl,
                      nodes:v.nodes.slice(0,16).map(n=>({
                        target:n.target,summary:n.failureSummary,
                        snippet:n.html.slice(0,260)
                      })),
                      totalNodes:v.nodes.length
                    }));
                  }""")
                  if device in ['desktop','celular']:
                    page.screenshot(path='relatorios-revista-integrada/'+name+'-'+device+'.png',full_page=True,animations='disabled')
                  # Amostra de navegação por teclado e presença de indicadores.
                  keyboard=[]
                  for i in range(12):
                    page.keyboard.press('Tab')
                    f=page.evaluate("""() => {
                      const e=document.activeElement;
                      if (!e || e===document.body)return null;
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      return {tag:e.tagName,role:e.getAttribute('role'),text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,100),
                        href:e.getAttribute('href'),outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,
                        boxShadow:s.boxShadow,rect:{x:r.x,y:r.y,width:r.width,height:r.height},overflow:e.scrollWidth>e.clientWidth};
                    }""")
                    if f: keyboard.append(f)
                  # Auditoria simples de imagens documentais e legendas.
                  docs=page.evaluate("""() => Array.from(document.querySelectorAll('img[src^="/documentos/"]')).map(img => ({
                    src:img.getAttribute('src'),alt:img.getAttribute('alt'),
                    inFigure:!!img.closest('figure'),hasCaption:!!img.closest('figure')?.querySelector('figcaption'),
                    width:img.naturalWidth,height:img.naturalHeight,renderedWidth:img.getBoundingClientRect().width
                  }))""")
                  semantica=page.evaluate("""() => ({
                    h1:Array.from(document.querySelectorAll('main h1')).map(n=>n.innerText.trim().slice(0,100)),
                    main:!!document.querySelector('main'),
                    imagens:Array.from(document.querySelectorAll('main img')).map(n=>({
                      src:n.getAttribute('src'),alt:n.getAttribute('alt'),carregada:n.complete&&n.naturalWidth>0,
                      legenda:!!n.closest('figure')?.querySelector('figcaption')
                    }))
                  })""")
                  if route == '/pioneiras/pagu':
                    fotos = page.locator('main header figure img')
                    if fotos.count() != 1: hard.append({'rota':route,'dispositivo':device,'erro':'Fotografia de Pagu ausente na compilação exclusiva de prévia'})
                    else:
                      alt=fotos.first.get_attribute('alt')
                      if not alt or not page.locator('main header figure figcaption').count():hard.append({'rota':route,'dispositivo':device,'erro':'Retrato em prévia sem alternativa ou legenda'})
                  if route == '/pioneiras/lelia-gonzalez':
                    retrato = page.locator('main header figure img')
                    if retrato.count() != 1 or not retrato.first.get_attribute('alt') or not page.locator('main header figure figcaption').count():
                      hard.append({'rota':route,'dispositivo':device,'erro':'Retrato de Lélia não aparece adequadamente no build explícito de prévia'})
                    else:
                      imagem_ok = retrato.first.evaluate('(img)=>img.complete && img.naturalWidth > 500')
                      if not imagem_ok: hard.append({'rota':route,'dispositivo':device,'erro':'Arquivo fotográfico de Lélia não carrega na prévia'})
                  widths=page.evaluate("""() => ({scroll:document.documentElement.scrollWidth,visible:window.innerWidth})""")
                  record={'rota':route,'dispositivo':device,'http':response.status if response else None,
                          'violacoes':axe,'foco_primeiros_12':keyboard,'documentos':docs,
                          'largura':widths,'semantica':semantica,'erros_js':js}
                  out.append(record)
                  violations.extend([{'rota':route,'dispositivo':device,'id':v['id'],'impacto':v['impact'],'ocorrencias':v['totalNodes']}
                    for v in axe])
                  if not response or response.status!=200 or js or not semantica['main'] or not semantica['h1'] or widths['scroll']>w+2:hard.append(record)
                except Exception as e:
                  hard.append({'rota':route,'dispositivo':device,'erro':str(e)})
                finally:page.close()
              ctx.close()
            browser.close()
          Path('relatorios-revista-integrada/diagnostico.json').write_text(json.dumps({'paginas':out,'erros_execucao':hard},ensure_ascii=False,indent=2))
          Path('relatorios-revista-integrada/resumo.json').write_text(json.dumps({'total_paginas':len(out),'violacoes':violations,'erros_execucao':hard},ensure_ascii=False,indent=2))
          print('Páginas',len(out),'regras com violações',len(violations),'erros de execução',len(hard))
          for v in violations[:35]: print(v)
          assert not hard,'Falha estrutural, JS ou largura nas páginas: ver diagnostico.json'
          assert not violations,'Axe detectou violações WCAG nas páginas: ver diagnostico.json'
          PY
      - name: Arquivar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qse-revista-integrada-capturas
          path: relatorios-revista-integrada/
          retention-days: 14
